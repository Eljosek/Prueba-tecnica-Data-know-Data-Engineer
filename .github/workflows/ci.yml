# =============================================================================
# CI/CD Pipeline - RetailMax Data Engineering
# =============================================================================
# Ejecuta validaciones automaticas en cada push y pull request a main:
#   - Lint de codigo Python (flake8)
#   - Pruebas de calidad de datos (quality_tests.py)
#   - Validacion de Terraform (terraform validate)
# =============================================================================

name: CI - RetailMax Data Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  TF_VERSION: "1.7.0"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint y formato de codigo Python
  # ---------------------------------------------------------------------------
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r data-generation/requirements.txt

      - name: Ejecutar flake8
        run: |
          flake8 data-generation/ pipelines/ orchestration/ \
            --max-line-length=120 \
            --exclude=__pycache__,.git \
            --count --statistics

  # ---------------------------------------------------------------------------
  # Job 2: Pruebas de calidad de datos
  # ---------------------------------------------------------------------------
  quality-tests:
    name: Quality Tests
    runs-on: ubuntu-latest
    needs: python-lint
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyodbc pandas

      - name: Ejecutar pruebas de calidad
        env:
          SQLSERVER_HOST: ${{ secrets.SQLSERVER_HOST }}
          SQLSERVER_DB: ${{ secrets.SQLSERVER_DB }}
          SQLSERVER_USER: ${{ secrets.SQLSERVER_USER }}
          SQLSERVER_PASSWORD: ${{ secrets.SQLSERVER_PASSWORD }}
        run: |
          python pipelines/tests/quality_tests.py

  # ---------------------------------------------------------------------------
  # Job 3: Validacion de Terraform
  # ---------------------------------------------------------------------------
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init (solo validacion)
        working-directory: infra
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: infra
        run: terraform validate

      - name: Terraform Format Check
        working-directory: infra
        run: terraform fmt -check -recursive
